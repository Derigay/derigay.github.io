
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Derigay Developments</title>

    <meta name="description" content="Thank you for contacting Derigay Developments. We look forward to discussing your construction project.">

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link href="https://fonts.googleapis.com/css?family=Raleway:400,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Raleway', sans-serif;
            background: #f5f6f8;
            color: #333;
        }

        .thank-you-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        .thank-you-content {
            width: 100%;
            max-width: 700px;
            padding: 60px 40px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .thank-you-icon {
            font-size: 65px;
            color: #084A86;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            color: #084A86;
            margin: 0 0 20px;
        }

        .thank-you-content p {
            font-size: 17px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 15px;
        }

        .home-button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 28px;
            background: #084A86;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            transition: background 0.3s ease;
        }

        .home-button:hover {
            background: #06365f;
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .thank-you-content {
                padding: 45px 25px;
            }

            h1 {
                font-size: 30px;
            }

            .thank-you-content p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="thank-you-section">
        <div class="thank-you-content">

            <i class="fa fa-check-circle thank-you-icon"
               aria-hidden="true"></i>

            <h1>Thank You!</h1>

            <p>
                Your message has been submitted successfully.
            </p>

            <p>
                Thank you for reaching out to Derigay Developments.
                We appreciate your interest and look forward to
                discussing your project with you.
            </p>

            <a href="index.html" class="home-button">
                <i class="fa fa-home" aria-hidden="true"></i>
                BACK TO HOME
            </a>

        </div>
    </main>

</body>
</html>
